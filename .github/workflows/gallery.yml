name: Generate Gallery Data

on:
  push:
    paths:
      - 'Landing/**'
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Check commit author
        id: check-author
        run: |
          if [[ "${{ github.event.head_commit.author.name }}" == "github-actions[bot]" ]]; then
            echo "Author is github-actions[bot]. Skipping to prevent infinite loop."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Optimize large images
        if: steps.check-author.outputs.skip != 'true'
        run: |
          echo "Compressing images larger than 2MB..."
          find Landing/ -type f \( -iname \*.jpg -o -iname \*.jpeg -o -iname \*.png \) -size +2M -exec mogrify -resize "1920x1920>" -quality 85 {} +
          echo "Image optimization complete."

      - name: Setup Node.js
        if: steps.check-author.outputs.skip != 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Run gallery generator script
        if: steps.check-author.outputs.skip != 'true'
        run: node scripts/generate-gallery.js
        
      - name: Commit and Push changes
        if: steps.check-author.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Landing/ gallery.json hero.json
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-optimize images and update json [skip ci]"
            git push
          fi
