name: Generate Gallery Data

on:
  push:
    paths:
      - 'Landing/**'
      - 'Baby/**'
      - 'Engagement/**'
      - 'Haldhi/**'
      - 'PreWedding/**'
      - 'Reception/**'
      - 'Wedding/**'
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Check commit author
        id: check-author
        run: |
          if [[ "${{ github.event.head_commit.author.name }}" == "github-actions[bot]" ]]; then
            echo "Author is github-actions[bot]. Skipping to prevent infinite loop."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Setup Node.js
        if: steps.check-author.outputs.skip != 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Optimize large images
        if: steps.check-author.outputs.skip != 'true'
        run: |
          echo "Installing sharp for image compression..."
          npm install sharp
          echo "Compressing images larger than 1.5MB..."
          node scripts/optimize-local.js
          echo "Image optimization complete."
          
      - name: Run gallery generator script
        if: steps.check-author.outputs.skip != 'true'
        run: node scripts/generate-gallery.js
        
      - name: Commit and Push changes
        if: steps.check-author.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Landing/ Baby/ Engagement/ Haldhi/ PreWedding/ Reception/ Wedding/ gallery.json hero.json
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-optimize images and update json [skip ci]"
            git push
          fi
